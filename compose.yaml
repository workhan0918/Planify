services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planify
      POSTGRES_USER: planify
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 환경변수를 설정해주세요}
    ports:
      - "5432:5432"
    volumes:
      - planify-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planify -d planify"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  planify-db:
