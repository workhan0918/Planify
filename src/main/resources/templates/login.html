<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · Planify</title><link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet"><link th:href="@{/css/planify.css}" rel="stylesheet"></head>
<body class="auth-page"><main class="card auth-card shadow-lg"><div class="auth-brand mb-1">Planify.</div><p class="text-muted mb-4">과제부터 피드백까지, 한 곳에서.</p><h1 class="h4 mb-4">로그인</h1>
<div class="alert alert-danger" th:if="${param.error}">이메일 또는 비밀번호를 확인해주세요.</div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-info" th:if="${param.logout}">로그아웃되었습니다.</div>
<form th:action="@{/login}" method="post"><div class="form-group"><label for="email">이메일</label><input class="form-control" id="email" name="email" type="email" autocomplete="username" required></div><div class="form-group"><label for="password">비밀번호</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary btn-block">로그인</button></form><hr><a class="text-center" th:href="@{/signup}">학생 회원가입</a><p class="small text-muted mt-3 mb-0">강사 계정은 관리자가 사전에 생성합니다.</p></main></body></html>
