<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('내 과제 목록', ~{::section})}"><section>
<h1 class="h3">내 과제 목록</h1><p class="page-intro">제출 기한을 확인하고, 채점 결과와 피드백을 살펴보세요.</p><div class="card shadow"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>강좌 · 과제</th><th>상태</th><th>제출 시작</th><th>제출 종료</th><th>제출 · 결과</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="empty">등록된 과제가 없습니다. 수강 등록 여부를 확인해주세요.</td></tr><tr th:each="r : ${rows}"><td><div class="small text-muted" th:text="${r.task.course.title}"></div><a th:href="@{/student/assignments/{id}(id=${r.task.id})}" th:text="${r.task.title}"></a></td><td><span class="badge" th:classappend="${r.status == '진행중' ? 'badge-primary' : (r.status == '예정' ? 'badge-info' : 'badge-secondary')}" th:text="${r.status}"></span></td><td th:text="${#temporals.format(r.task.startsAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${#temporals.format(r.task.endsAt,'yyyy-MM-dd HH:mm')}"></td><td><span th:if="${r.submission == null}" class="text-muted">미제출</span><span th:if="${r.submission != null}" th:text="${r.submission.score == null ? '제출 완료 · 채점 대기' : r.submission.score + ' / ' + r.task.maxScore + '점'}"></span></td></tr></tbody></table></div></div>
</section></html>
