<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('내 과제 목록', ~{::section})}"><section>
<h1 class="h3">내 과제 목록</h1><p class="page-intro">제출 기한과 채점 결과를 검색하세요.</p>
<form th:action="@{/student/assignments}" method="get" class="card shadow mb-4"><div class="card-body row align-items-end">
<div class="col-lg-3 form-group"><label for="q">검색</label><input id="q" name="q" class="form-control" th:value="${q}" placeholder="과제명 · 강좌명"></div>
<div class="col-lg-3 form-group"><label for="courseId">강좌</label><select id="courseId" name="courseId" class="form-control"><option value="">전체</option><option th:each="c : ${courses}" th:value="${c.id}" th:selected="${c.id == courseId}" th:text="${c.title}"></option></select></div>
<div class="col-lg-2 form-group"><label for="status">진행 상태</label><select id="status" name="status" class="form-control"><option value="">전체</option><option th:each="state : ${ {'예정','진행중','마감'} }" th:value="${state}" th:selected="${state == status}" th:text="${state}"></option></select></div>
<div class="col-lg-2 form-group"><label for="submitted">제출 상태</label><select id="submitted" name="submitted" class="form-control"><option value="">전체</option><option th:each="state : ${ {'미제출','채점대기','채점완료'} }" th:value="${state}" th:selected="${state == submitted}" th:text="${state}"></option></select></div>
<div class="col-lg-2 form-group"><button class="btn btn-primary">검색</button><a class="btn btn-link btn-sm" th:href="@{/student/assignments}">초기화</a></div></div></form>
<div class="card shadow"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>강좌 · 과제</th><th>상태</th><th>제출 시작</th><th>제출 종료</th><th>제출 · 결과</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="empty">검색 조건에 맞는 과제가 없습니다.</td></tr><tr th:each="r : ${rows}"><td><div class="small text-muted" th:text="${r.task.course.title}"></div><a th:href="@{/student/assignments/{id}(id=${r.task.id})}" th:text="${r.task.title}"></a></td><td><span class="badge" th:classappend="${r.status == '진행중' ? 'badge-primary' : (r.status == '예정' ? 'badge-info' : 'badge-secondary')}" th:text="${r.status}"></span></td><td th:text="${#temporals.format(r.task.startsAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${#temporals.format(r.task.endsAt,'yyyy-MM-dd HH:mm')}"></td><td><span th:if="${r.submission == null}" class="text-muted">미제출</span><span th:if="${r.submission != null}" th:text="${r.submission.score == null ? '제출 완료 · 채점 대기' : r.submission.score + ' / ' + r.task.maxScore + '점'}"></span><span th:if="${r.submission != null and r.submission.unlocked}" class="badge badge-warning">재제출 허용</span></td></tr></tbody></table></div></div>
</section></html>
