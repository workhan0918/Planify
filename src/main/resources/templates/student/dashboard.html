<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('내 통계', ~{::section})}"><section>
<h1 class="h3">내 통계</h1><p class="page-intro">나의 제출 현황과 다가오는 마감일을 확인하세요.</p><div class="row"><div class="col-md-4 mb-4"><div class="card border-left-primary shadow"><div class="card-body"><div class="text-primary small">제출률</div><div class="stat-value" th:text="${#numbers.formatDecimal(stats.rate,1,1)} + '%'"></div><div class="small text-muted" th:text="${stats.submitted} + ' / ' + ${stats.expected} + '개 제출'"></div></div></div></div><div class="col-md-4 mb-4"><div class="card border-left-success shadow"><div class="card-body"><div class="text-success small">평균 점수 (배점 대비)</div><div class="stat-value" th:text="${stats.average == null ? '—' : #numbers.formatDecimal(stats.average,1,1) + '%'}"></div><div class="small text-muted">채점 완료 · 배점 0 초과 과제 기준</div></div></div></div><div class="col-md-4 mb-4"><div class="card border-left-warning shadow"><div class="card-body"><div class="text-warning small">24시간 내 마감 임박</div><div class="stat-value" th:text="${stats.urgent} + '개'"></div><div class="small text-muted">진행중인 미제출 과제</div></div></div></div></div>
<div class="row"><div class="col-lg-5"><div class="card shadow mb-4"><div class="card-header">제출 현황</div><div class="card-body chart-box"><canvas data-chart="doughnut" data-labels='["제출","미제출"]' th:attr="data-values='[' + ${stats.submitted} + ',' + ${stats.expected - stats.submitted} + ']'"></canvas></div></div></div><div class="col-lg-7"><div class="card shadow"><div class="card-header">마감 임박 과제</div><div class="card-body"><div class="empty" th:if="${#lists.isEmpty(urgentRows)}">24시간 내 마감되는 미제출 과제가 없습니다.</div><div class="border-bottom py-3" th:each="r : ${urgentRows}"><a th:href="@{/student/assignments/{id}(id=${r.task.id})}" th:text="${r.task.title}"></a><div class="small text-muted" th:text="${r.task.course.title} + ' · ' + ${#temporals.format(r.task.endsAt,'MM-dd HH:mm')} + ' 마감'"></div></div><a class="btn btn-outline-primary btn-sm mt-3" th:href="@{/student/assignments}">전체 과제 보기</a></div></div></div></div><p class="small text-muted mt-3">제출률에는 예정 과제도 포함됩니다. 평균 점수는 각 과제의 점수 ÷ 배점 × 100을 계산한 뒤 평균합니다.</p>
</section></html>
