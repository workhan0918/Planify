<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('과제 제출 · 결과', ~{::section})}"><section>
<a th:href="@{/student/assignments}">← 내 과제 목록</a><h1 class="h3 mt-3" th:text="${task.title}"></h1><p class="page-intro"><span th:text="${task.course.title}"></span> · <span class="badge badge-primary" th:text="${status}"></span> · 배점 <span th:text="${task.maxScore}"></span>점</p>
<div class="card shadow mb-4"><div class="card-body"><p><strong>제출 기간</strong><br><span th:text="${#temporals.format(task.startsAt,'yyyy-MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(task.endsAt,'yyyy-MM-dd HH:mm')}"></span></p><p class="description" th:text="${task.description}"></p><a th:if="${task.attachmentKey != null}" th:href="@{/files/assignments/{id}(id=${task.id})}" th:text="'과제 첨부: ' + ${task.attachmentName}"></a>
<ul class="mt-3" th:unless="${#lists.isEmpty(task.rubric)}"><li th:each="criterion : ${task.rubric}" th:text="${criterion.name} + ': ' + ${criterion.points} + '점'"></li></ul></div></div>
<div class="row"><div class="col-lg-6"><div class="card shadow mb-4"><div class="card-body"><h2 class="h5 mb-3">과제 제출</h2>
<div th:if="${submission != null}" class="mb-3"><a th:href="@{/files/submissions/{id}(id=${submission.id})}" th:text="${submission.fileName}"></a><div class="small text-muted" th:text="'제출: ' + ${#temporals.format(submission.submittedAt,'yyyy-MM-dd HH:mm')}"></div><a class="small" th:href="@{/submissions/{id}/history(id=${submission.id})}">제출 이력 · 개발 기록 비교</a></div>
<div class="alert alert-info" th:if="${submission != null and submission.unlocked}">강사가 재제출을 허용했습니다. 새 제출 시 이전 점수와 피드백은 이력에 보존되며 다시 채점됩니다.</div>
<form th:if="${open and (submission == null or submission.score == null or submission.unlocked)}" th:action="@{/student/assignments/{id}/submit(id=${task.id})}" th:object="${developmentForm}" method="post" enctype="multipart/form-data">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div></div>
<div class="form-group"><label for="file">파일 1개 · 최대 20MB</label><input class="form-control-file" id="file" name="file" type="file" required></div>
<h3 class="h6 mt-4">바이브 코딩 개발 과정 (선택)</h3><div class="form-group"><label for="aiTools">사용한 AI 도구</label><input class="form-control" th:field="*{aiTools}" maxlength="500" placeholder="예: ChatGPT, Codex"></div>
<div class="form-group"><label for="prompts">주요 프롬프트</label><textarea class="form-control" th:field="*{prompts}" maxlength="10000" rows="4"></textarea></div>
<div class="form-group"><label for="modifications">직접 수정한 내용</label><textarea class="form-control" th:field="*{modifications}" maxlength="10000" rows="4"></textarea></div>
<div class="form-group"><label for="verification">검증 방법</label><textarea class="form-control" th:field="*{verification}" maxlength="10000" rows="4"></textarea></div>
<p class="small text-muted">이전 파일과 개발 기록은 이력에 보존됩니다. 기간 내 채점 전 또는 강사가 잠금을 해제한 경우 재제출할 수 있습니다.</p><button class="btn btn-primary" th:text="${submission == null ? '제출하기' : '재제출하기'}"></button></form>
<p class="text-muted" th:if="${!open}">제출 기간이 아닙니다.</p><p class="text-success" th:if="${submission != null and submission.score != null and !submission.unlocked}">채점 완료 상태입니다. 재제출은 강사가 기간 내 잠금을 해제한 경우 가능합니다.</p></div></div></div>
<div class="col-lg-6"><div class="card shadow"><div class="card-body"><h2 class="h5 mb-3">점수 · 피드백</h2><p class="text-muted" th:if="${submission == null}">과제를 먼저 제출해주세요.</p><p class="text-muted" th:if="${submission != null and submission.score == null}">강사의 채점을 기다리고 있습니다.</p>
<th:block th:if="${submission != null and submission.score != null}"><div class="stat-value mb-3" th:text="${submission.score} + ' / ' + ${task.maxScore} + '점'"></div><ul th:unless="${#lists.isEmpty(task.rubric)}"><li th:each="criterion, i : ${task.rubric}" th:text="${criterion.name} + ': ' + ${submission.rubricScores[i.index]} + ' / ' + ${criterion.points}"></li></ul><p class="description" th:text="${#strings.isEmpty(submission.feedback) ? '등록된 피드백이 없습니다.' : submission.feedback}"></p><div class="small text-muted" th:text="'채점: ' + ${#temporals.format(submission.gradedAt,'yyyy-MM-dd HH:mm')}"></div></th:block>
<div class="mt-4" th:if="${submission != null}"><div th:insert="~{fragments :: development(${submission.development})}"></div></div></div></div></div></div>
</section></html>
