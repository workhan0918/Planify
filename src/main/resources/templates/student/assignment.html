<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('과제 제출 · 결과', ~{::section})}"><section>
<a th:href="@{/student/assignments}">← 내 과제 목록</a><h1 class="h3 mt-3" th:text="${task.title}"></h1><p class="page-intro"><span th:text="${task.course.title}"></span> · <span class="badge badge-primary" th:text="${status}"></span> · 배점 <span th:text="${task.maxScore}"></span>점</p><div class="card shadow mb-4"><div class="card-body"><p><strong>제출 기간</strong><br><span th:text="${#temporals.format(task.startsAt,'yyyy-MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(task.endsAt,'yyyy-MM-dd HH:mm')}"></span></p><p class="description" th:text="${task.description}"></p><a th:if="${task.attachmentKey != null}" th:href="@{/files/assignments/{id}(id=${task.id})}" th:text="'과제 첨부: ' + ${task.attachmentName}"></a></div></div>
<div class="row"><div class="col-lg-6"><div class="card shadow mb-4"><div class="card-body"><h2 class="h5 mb-3">과제 제출</h2><div th:if="${submission != null}" class="mb-3"><a th:href="@{/files/submissions/{id}(id=${submission.id})}" th:text="${submission.fileName}"></a><div class="small text-muted" th:text="'제출: ' + ${#temporals.format(submission.submittedAt,'yyyy-MM-dd HH:mm')}"></div></div><form th:if="${open and (submission == null or submission.score == null)}" th:action="@{/student/assignments/{id}/submit(id=${task.id})}" method="post" enctype="multipart/form-data"><div class="form-group"><label for="file">파일 1개 · 최대 20MB</label><input class="form-control-file" id="file" name="file" type="file" required></div><p class="small text-muted">재제출하면 기존 파일이 교체됩니다. 채점 이후에는 재제출할 수 없습니다.</p><button class="btn btn-primary" th:text="${submission == null ? '제출하기' : '재제출하기'}"></button></form><p class="text-muted" th:if="${!open}">제출 기간이 아닙니다.</p><p class="text-success" th:if="${submission != null and submission.score != null}">채점이 완료되어 재제출할 수 없습니다.</p></div></div></div>
<div class="col-lg-6"><div class="card shadow"><div class="card-body"><h2 class="h5 mb-3">점수 · 피드백</h2><p class="text-muted" th:if="${submission == null}">과제를 먼저 제출해주세요.</p><p class="text-muted" th:if="${submission != null and submission.score == null}">강사의 채점을 기다리고 있습니다.</p><th:block th:if="${submission != null and submission.score != null}"><div class="stat-value mb-3" th:text="${submission.score} + ' / ' + ${task.maxScore} + '점'"></div><p class="description" th:text="${#strings.isEmpty(submission.feedback) ? '등록된 피드백이 없습니다.' : submission.feedback}"></p><div class="small text-muted" th:text="'채점: ' + ${#temporals.format(submission.gradedAt,'yyyy-MM-dd HH:mm')}"></div></th:block></div></div></div></div>
</section></html>
