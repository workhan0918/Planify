<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('수강 등록', ~{::section})}"><section>
<h1 class="h3">내 강좌</h1><p class="page-intro">강사에게 받은 참여코드로 수강 등록하세요.</p><div class="card shadow mb-4"><div class="card-body"><form th:action="@{/student/enroll}" method="post"><label for="code">참여코드</label><div class="input-group"><input class="form-control" id="code" name="code" maxlength="12" placeholder="참여코드 입력" required><div class="input-group-append"><button class="btn btn-primary">수강 등록</button></div></div></form></div></div><div class="row"><div class="col-md-6 col-xl-4 mb-4" th:each="c : ${courses}"><div class="card shadow h-100"><div class="card-body"><h2 class="h5" th:text="${c.title}"></h2><p class="description text-muted" th:text="${c.description}"></p><div class="small mb-3" th:text="'담당 강사: ' + ${c.instructor.name}"></div><a class="btn btn-outline-primary btn-sm" th:href="@{/student/assignments}">내 과제 확인</a></div></div></div></div><div class="empty card" th:if="${#lists.isEmpty(courses)}">등록한 강좌가 없습니다.</div>
</section></html>
