<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('강좌 관리', ~{::section})}"><section>
<h1 class="h3">강좌 관리</h1><p class="page-intro">강좌를 개설하고 참여코드로 학생을 초대하세요.</p><div class="row"><div class="col-lg-7"><div class="card shadow mb-4"><div class="card-body"><h2 class="h5 mb-4">내 강좌</h2><div class="empty" th:if="${#lists.isEmpty(courses)}">아직 개설된 강좌가 없습니다.</div><div class="list-group list-group-flush"><a class="list-group-item list-group-item-action" th:each="c : ${courses}" th:href="@{/instructor/courses/{id}(id=${c.id})}"><strong th:text="${c.title}"></strong><div class="small text-muted mt-2">참여코드 <span th:text="${c.code}"></span> · 수강생과 과제 관리 →</div></a></div></div></div></div>
<div class="col-lg-5"><div class="card shadow"><div class="card-body"><h2 class="h5 mb-4">새 강좌 개설</h2><form th:action="@{/instructor/courses}" th:object="${form}" method="post"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div></div><div class="form-group"><label for="title">강좌명</label><input class="form-control" th:field="*{title}" maxlength="120" required></div><div class="form-group"><label for="description">강좌 소개</label><textarea class="form-control" th:field="*{description}" rows="4" maxlength="4000"></textarea></div><button class="btn btn-primary">강좌 개설</button></form></div></div></div></div>
</section></html>
