<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('과제 설정', ~{::section})}"><section>
<h1 class="h3" th:text="${taskId == null ? '새 과제 등록' : '과제 수정'}"></h1><p class="page-intro" th:text="${course.title} + ' · 제출 기간과 배점을 설정하세요.'"></p>
<div class="card shadow"><div class="card-body"><form th:action="@{/instructor/courses/{id}/assignments(id=${course.id})}" th:object="${form}" method="post" enctype="multipart/form-data">
<input th:if="${taskId != null}" type="hidden" name="taskId" th:value="${taskId}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div></div>
<div class="form-group"><label for="title">과제명</label><input class="form-control" th:field="*{title}" maxlength="150" required></div>
<div class="form-group"><label for="description">과제 내용 · 제출 안내</label><textarea class="form-control" th:field="*{description}" rows="7" maxlength="10000" required></textarea></div>
<div class="row"><div class="col-md-4 form-group"><label for="startsAt">제출 시작 (한국 시간)</label><input class="form-control" type="datetime-local" th:field="*{startsAt}" required></div><div class="col-md-4 form-group"><label for="endsAt">제출 종료 (한국 시간)</label><input class="form-control" type="datetime-local" th:field="*{endsAt}" required></div><div class="col-md-4 form-group"><label for="maxScore">총배점 (항목이 없을 때)</label><input class="form-control" type="number" th:field="*{maxScore}" min="0" max="100000" required><small>기본 0점 · 평가 항목을 입력하면 합계로 설정됩니다.</small></div></div>
<div class="form-group"><label for="rubricText">평가 항목 (선택)</label><textarea class="form-control" th:field="*{rubricText}" rows="5" maxlength="4000" placeholder="기능 구현 | 50&#10;화면 구성 | 30&#10;개발 기록 | 20"></textarea><small class="text-muted">항목명 | 배점 형식으로 한 줄씩, 최대 20개. 항목 배점 합계가 과제 총배점입니다. 채점 이후 항목 변경은 제한됩니다.</small></div>
<div class="form-group"><label for="attachment">과제 첨부파일 (선택 · 1개 · 최대 20MB)</label><input class="form-control-file" id="attachment" name="attachment" type="file"><small class="text-muted" th:if="${attachmentName}" th:text="'기존 파일: ' + ${attachmentName} + ' · 새 파일을 선택하면 교체됩니다.'"></small></div>
<button class="btn btn-primary">저장</button><a class="btn btn-outline-secondary ml-2" th:href="@{/instructor/courses/{id}(id=${course.id})}">취소</a></form></div></div>
</section></html>
