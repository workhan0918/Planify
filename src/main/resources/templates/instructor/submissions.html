<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('제출 현황 · 채점', ~{::section})}"><section>
<a th:href="@{/instructor/courses/{id}(id=${task.course.id})}">← 강좌로 돌아가기</a><h1 class="h3 mt-3" th:text="${task.title}"></h1><p class="text-muted">배점 <strong th:text="${task.maxScore}"></strong>점 · 제출률 <strong th:text="${#numbers.formatDecimal(stats.rate,1,1)} + '%'"></strong> · 평균 <strong th:text="${stats.average == null ? '채점 없음' : #numbers.formatDecimal(stats.average,1,1) + '점'}"></strong></p><p class="description" th:text="${task.description}"></p><a th:if="${task.attachmentKey != null}" th:href="@{/files/assignments/{id}(id=${task.id})}" th:text="${task.attachmentName}"></a>
<div class="row mt-4"><div class="col-lg-8"><h2 class="h5">제출 · 채점</h2><div th:each="r : ${rows}" th:if="${r.submission != null}" class="card shadow mb-3"><div class="card-body"><div class="d-flex justify-content-between"><h3 class="h6" th:text="${r.student.studentNumber} + ' · ' + ${r.student.name}"></h3><span class="badge" th:classappend="${r.submission.score == null ? 'badge-info' : 'badge-success'}" th:text="${r.submission.score == null ? '채점 대기' : '채점 완료'}"></span></div><a th:href="@{/files/submissions/{id}(id=${r.submission.id})}" th:text="${r.submission.fileName}"></a><div class="small text-muted mt-2 mb-3" th:text="'제출: ' + ${#temporals.format(r.submission.submittedAt,'yyyy-MM-dd HH:mm')}"></div><form th:action="@{/instructor/submissions/{id}/grade(id=${r.submission.id})}" method="post"><div class="form-group"><label th:for="'score-' + ${r.submission.id}">점수 (0~<span th:text="${task.maxScore}"></span>)</label><input class="form-control" type="number" th:id="'score-' + ${r.submission.id}" name="score" min="0" th:max="${task.maxScore}" th:value="${r.submission.score}" required></div><div class="form-group"><label th:for="'feedback-' + ${r.submission.id}">피드백</label><textarea class="form-control feedback-input" th:id="'feedback-' + ${r.submission.id}" name="feedback" maxlength="5000" th:text="${r.submission.feedback}"></textarea></div><button class="btn btn-primary btn-sm" th:text="${r.submission.score == null ? '채점 저장' : '채점 수정'}"></button></form></div></div><div class="empty card" th:if="${stats.submitted == 0}">아직 제출물이 없습니다.</div></div>
<div class="col-lg-4"><h2 class="h5">미제출자 <span class="badge badge-warning" th:text="${stats.expected - stats.submitted}"></span></h2><div class="card shadow"><div class="card-body"><p class="small text-muted">예정·진행중 과제의 미제출 학생도 포함합니다.</p><div class="border-bottom py-2" th:each="r : ${rows}" th:if="${r.submission == null}"><strong th:text="${r.student.name}"></strong><div class="small text-muted" th:text="${r.student.studentNumber}"></div></div><p th:if="${stats.expected == stats.submitted}" class="mb-0">미제출자가 없습니다.</p></div></div></div></div>
</section></html>
