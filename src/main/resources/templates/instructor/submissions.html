<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('제출 현황 · 채점', ~{::section})}"><section>
<a th:href="@{/instructor/courses/{id}(id=${task.course.id})}">← 강좌로 돌아가기</a><h1 class="h3 mt-3" th:text="${task.title}"></h1>
<p class="text-muted">배점 <strong th:text="${task.maxScore}"></strong>점 · 제출률 <strong th:text="${#numbers.formatDecimal(stats.rate,1,1)} + '%'"></strong> · 평균 <strong th:text="${stats.average == null ? '채점 없음' : #numbers.formatDecimal(stats.average,1,1) + '점'}"></strong></p>
<div class="card shadow mb-4"><div class="card-body"><div class="d-flex justify-content-between"><strong>채점 진행률</strong><span th:text="${stats.graded} + ' / ' + ${stats.submitted} + '건 · 대기 ' + ${stats.pending} + '건'"></span></div><div class="progress mt-2"><div class="progress-bar bg-success" role="progressbar" aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${stats.gradingRate}" th:style="'width:' + ${stats.gradingRate} + '%'" th:text="${#numbers.formatDecimal(stats.gradingRate,1,1)} + '%'"></div></div></div></div>
<p class="description" th:text="${task.description}"></p><a th:if="${task.attachmentKey != null}" th:href="@{/files/assignments/{id}(id=${task.id})}" th:text="${task.attachmentName}"></a>
<form th:action="@{/instructor/assignments/{id}(id=${task.id})}" method="get" class="row my-4"><div class="col-md-6 form-group"><label for="q">수강생 검색</label><input id="q" name="q" th:value="${q}" class="form-control" placeholder="이름 또는 학번"></div><div class="col-md-4 form-group"><label for="submitted">제출 · 채점 상태</label><select id="submitted" name="submitted" class="form-control"><option value="">전체</option><option th:each="state : ${ {'미제출','채점대기','채점완료'} }" th:value="${state}" th:selected="${state == submitted}" th:text="${state}"></option></select></div><div class="col-md-2 form-group align-self-end"><button class="btn btn-primary">검색</button></div></form>
<div class="row"><div class="col-lg-8"><h2 class="h5">제출 · 채점</h2>
<div th:each="r : ${rows}" th:if="${r.submission != null}" class="card shadow mb-3"><div class="card-body">
<div class="d-flex justify-content-between"><h3 class="h6" th:text="${r.student.studentNumber} + ' · ' + ${r.student.name}"></h3><span class="badge" th:classappend="${r.submission.score == null ? 'badge-info' : 'badge-success'}" th:text="${r.submission.score == null ? '채점 대기' : '채점 완료'}"></span></div>
<a th:href="@{/files/submissions/{id}(id=${r.submission.id})}" th:text="${r.submission.fileName}"></a><a class="small ml-3" th:href="@{/submissions/{id}/history(id=${r.submission.id})}">제출 이력 · 비교 · 해제 기록</a>
<div class="small text-muted mt-2 mb-3" th:text="'제출: ' + ${#temporals.format(r.submission.submittedAt,'yyyy-MM-dd HH:mm')}"></div>
<div th:replace="~{fragments :: development(${r.submission.development})}"></div>
<form th:action="@{/instructor/submissions/{id}/grade(id=${r.submission.id})}" method="post">
<div class="form-group" th:if="${#lists.isEmpty(task.rubric)}"><label th:for="'score-' + ${r.submission.id}">점수 (0~<span th:text="${task.maxScore}"></span>)</label><input class="form-control" type="number" th:id="'score-' + ${r.submission.id}" name="score" min="0" th:max="${task.maxScore}" th:value="${r.submission.score}" required></div>
<div th:unless="${#lists.isEmpty(task.rubric)}"><div class="form-group" th:each="criterion, i : ${task.rubric}"><label th:for="'rubric-' + ${r.submission.id} + '-' + ${i.index}" th:text="${criterion.name} + ' (0~' + ${criterion.points} + '점)'"></label><input class="form-control" type="number" name="itemScores" th:id="'rubric-' + ${r.submission.id} + '-' + ${i.index}" min="0" th:max="${criterion.points}" th:value="${r.submission.rubricScores[i.index]}" required></div><p class="small text-muted">항목별 점수 합계가 최종 점수입니다.</p></div>
<div class="form-group"><label th:for="'feedback-' + ${r.submission.id}">피드백</label><textarea class="form-control feedback-input" th:id="'feedback-' + ${r.submission.id}" name="feedback" maxlength="5000" th:text="${r.submission.feedback}"></textarea></div><button class="btn btn-primary btn-sm" th:text="${r.submission.score == null ? '채점 저장' : '채점 수정'}"></button></form>
<p class="alert alert-info mt-3" th:if="${r.submission.unlocked}">재제출을 허용한 상태입니다. 새 제출 전까지 현재 점수가 유지됩니다.</p>
<details class="mt-3" th:if="${open and r.submission.score != null and !r.submission.unlocked}"><summary class="text-warning">학생에게 재제출 허용</summary><form class="mt-2" th:action="@{/instructor/submissions/{id}/unlock(id=${r.submission.id})}" method="post" data-confirm="기간 내 재제출을 허용합니다. 새 파일이 제출되면 현재 점수와 피드백은 이력으로 이동합니다. 허용하시겠습니까?"><label th:for="'reason-' + ${r.submission.id}">해제 사유</label><input class="form-control mb-2" th:id="'reason-' + ${r.submission.id}" name="reason" maxlength="500" required><button class="btn btn-outline-warning btn-sm">잠금 해제</button></form></details>
</div></div><p class="text-muted">검색 조건에 맞는 제출물이 표시됩니다.</p></div>
<div class="col-lg-4"><h2 class="h5">미제출자 <span class="badge badge-warning" th:text="${stats.expected - stats.submitted}"></span></h2><div class="card shadow"><div class="card-body"><p class="small text-muted">예정·진행중 과제도 포함합니다. 검색 조건이 목록에 적용됩니다.</p><div class="border-bottom py-2" th:each="r : ${rows}" th:if="${r.submission == null}"><strong th:text="${r.student.name}"></strong><div class="small text-muted" th:text="${r.student.studentNumber}"></div></div><p th:if="${stats.expected == stats.submitted}" class="mb-0">미제출자가 없습니다.</p></div></div></div></div>
</section></html>
