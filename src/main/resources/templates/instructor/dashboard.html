<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('통계 대시보드', ~{::section})}"><section>
<h1 class="h3">통계 대시보드</h1><p class="page-intro">강좌별 제출 현황과 채점 결과를 확인하세요.</p><div class="empty card shadow" th:if="${#lists.isEmpty(courseStats)}">개설된 강좌가 없습니다. <a th:href="@{/instructor/courses}">첫 강좌 개설하기</a></div>
<th:block th:unless="${#lists.isEmpty(courseStats)}"><div class="row"><div class="col-lg-6"><div class="card shadow mb-4"><div class="card-header">강좌별 제출률 (%)</div><div class="card-body chart-box"><canvas data-chart="bar" data-label="제출률 (%)" data-percent="true" th:attr="data-labels=${labels},data-values=${rates}" id="rateChart"></canvas></div></div></div><div class="col-lg-6"><div class="card shadow mb-4"><div class="card-header">강좌별 평균 점수</div><div class="card-body chart-box"><canvas data-chart="bar" data-label="평균 점수" th:attr="data-labels=${labels},data-values=${averages}" id="averageChart"></canvas></div></div></div></div>
<div class="card shadow"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>강좌</th><th>제출 / 전체</th><th>제출률</th><th>평균 점수</th><th>미제출 건수</th></tr></thead><tbody><tr th:each="row : ${courseStats}"><td><a th:href="@{/instructor/courses/{id}(id=${row.course.id})}" th:text="${row.course.title}"></a></td><td th:text="${row.stats.submitted} + ' / ' + ${row.stats.expected}"></td><td th:text="${#numbers.formatDecimal(row.stats.rate,1,1)} + '%'"></td><td th:text="${row.stats.average == null ? '채점 없음' : #numbers.formatDecimal(row.stats.average,1,1) + '점'}"></td><td th:text="${row.stats.expected - row.stats.submitted}"></td></tr></tbody></table></div></div><p class="small text-muted mt-3">강좌 제출률 = 제출 건수 ÷ (등록 학생 수 × 과제 수). 예정 과제도 포함합니다. 평균은 채점 완료된 원점수의 평균입니다. 학생별 미제출 목록은 강좌의 과제를 선택하면 확인할 수 있습니다.</p></th:block>
<script th:inline="javascript">document.addEventListener('DOMContentLoaded', function(){const labels = /*[[${labels}]]*/ [];const rates = /*[[${rates}]]*/ [];const averages = /*[[${averages}]]*/ [];const a=document.getElementById('rateChart'), b=document.getElementById('averageChart');if(a){a.dataset.labels=JSON.stringify(labels);a.dataset.values=JSON.stringify(rates);b.dataset.labels=JSON.stringify(labels);b.dataset.values=JSON.stringify(averages);}});</script>
<div class="card shadow mt-4" th:unless="${#lists.isEmpty(courseStats)}"><div class="card-header">강좌별 채점 진행률</div><div class="card-body"><div class="mb-3" th:each="row : ${courseStats}"><strong th:text="${row.course.title}"></strong><span class="float-right small" th:text="${row.stats.graded} + ' / ' + ${row.stats.submitted} + '건 · 대기 ' + ${row.stats.pending} + '건'"></span><div class="progress mt-2"><div class="progress-bar bg-success" role="progressbar" aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${row.stats.gradingRate}" th:style="'width:' + ${row.stats.gradingRate} + '%'" th:text="${#numbers.formatDecimal(row.stats.gradingRate,1,1)} + '%'"></div></div></div></div></div>
</section></html>
