<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('강좌 상세', ~{::section})}"><section>
<a th:href="@{/instructor/courses}" class="small">← 강좌 목록</a><div class="d-flex justify-content-between align-items-center my-3"><h1 class="h3 mb-0" th:text="${course.title}"></h1><a class="btn btn-primary" th:href="@{/instructor/courses/{id}/assignments/new(id=${course.id})}">과제 등록</a></div><p class="description text-muted" th:text="${course.description}"></p><div class="card border-left-primary shadow mb-4"><div class="card-body">참여코드 <strong class="course-code ml-3" th:text="${course.code}"></strong><span class="small text-muted ml-3">학생에게 이 코드를 안내하세요.</span></div></div>
<div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0">과제 목록</h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>과제</th><th>제출 시작</th><th>제출 종료</th><th>배점</th><th>관리</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(tasks)}"><td colspan="5" class="empty">등록된 과제가 없습니다.</td></tr><tr th:each="t : ${tasks}"><td><a th:href="@{/instructor/assignments/{id}(id=${t.id})}" th:text="${t.title}"></a></td><td th:text="${#temporals.format(t.startsAt, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${#temporals.format(t.endsAt, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${t.maxScore}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/instructor/assignments/{id}/edit(id=${t.id})}">수정</a><form class="d-inline" th:action="@{/instructor/assignments/{id}/delete(id=${t.id})}" method="post" data-confirm="과제와 제출물·점수·첨부파일이 모두 삭제됩니다. 삭제하시겠습니까?"><button class="btn btn-sm btn-outline-danger">삭제</button></form></td></tr></tbody></table></div></div>
<div class="card shadow"><div class="card-header"><h2 class="h6 m-0">수강생 목록 <span class="badge badge-primary" th:text="${#lists.size(students)}"></span></h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>학번</th><th>이름</th><th>이메일</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(students)}"><td colspan="3" class="empty">참여코드로 등록한 학생이 없습니다.</td></tr><tr th:each="e : ${students}"><td th:text="${e.student.studentNumber}"></td><td th:text="${e.student.name}"></td><td th:text="${e.student.email}"></td></tr></tbody></table></div></div>
</section></html>
