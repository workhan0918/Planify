<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('강좌 상세', ~{::section})}"><section>
<a th:href="@{/instructor/courses}" class="small">← 강좌 목록</a>
<div class="d-flex flex-wrap justify-content-between align-items-center my-3"><h1 class="h3 mb-2" th:text="${course.title}"></h1><div>
<a class="btn btn-outline-success mb-2" th:href="@{/instructor/courses/{id}/grades.csv(id=${course.id})}">성적표 CSV 다운로드</a>
<a class="btn btn-primary mb-2" th:href="@{/instructor/courses/{id}/assignments/new(id=${course.id})}">과제 등록</a></div></div>
<p class="description text-muted" th:text="${course.description}"></p>
<div class="card border-left-primary shadow mb-4"><div class="card-body d-flex flex-wrap align-items-center">참여코드 <strong class="course-code ml-3" th:text="${course.code}"></strong><span class="small text-muted ml-3">학생에게 이 코드를 안내하세요.</span><form class="ml-auto" method="post" th:action="@{/instructor/courses/{id}/refresh-code(id=${course.id})}" data-confirm="새 코드를 발급하면 이전 참여코드는 즉시 사용할 수 없게 됩니다. 계속하시겠습니까?"><button class="btn btn-sm btn-outline-warning">↻ 새 코드 발급</button></form></div></div>
<form method="get" th:action="@{/instructor/courses/{id}(id=${course.id})}" class="card shadow mb-4"><div class="card-body row align-items-end">
<div class="col-md-6 form-group"><label for="q">과제 검색</label><input id="q" name="q" th:value="${q}" class="form-control" placeholder="과제명" maxlength="150"></div>
<div class="col-md-4 form-group"><label for="status">진행 상태</label><select id="status" name="status" class="form-control"><option value="">전체</option><option th:each="state : ${ {'예정','진행중','마감'} }" th:value="${state}" th:selected="${state == status}" th:text="${state}"></option></select></div>
<div class="col-md-2 form-group"><button class="btn btn-primary">검색</button></div></div></form>
<div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0">과제 목록</h2></div><div class="table-responsive"><table class="table mb-0">
<thead><tr><th>과제</th><th>제출 시작</th><th>제출 종료</th><th>배점</th><th>관리</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(tasks)}"><td colspan="5" class="empty">검색 조건에 맞는 과제가 없습니다.</td></tr>
<tr th:each="t : ${tasks}"><td><a th:href="@{/instructor/assignments/{id}(id=${t.id})}" th:text="${t.title}"></a></td><td th:text="${#temporals.format(t.startsAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${#temporals.format(t.endsAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${t.maxScore}"></td><td>
<a class="btn btn-sm btn-outline-primary" th:href="@{/instructor/assignments/{id}/edit(id=${t.id})}">수정</a>
<form class="d-inline" th:action="@{/instructor/assignments/{id}/duplicate(id=${t.id})}" method="post" data-confirm="내용·배점·자료를 복제하고 당일 제출 기간의 새 과제를 등록합니다. 등록 학생에게 알림이 전달됩니다. 복제하시겠습니까?"><button class="btn btn-sm btn-outline-secondary">복제</button></form>
<form class="d-inline" th:action="@{/instructor/assignments/{id}/delete(id=${t.id})}" method="post" data-confirm="과제와 모든 제출 이력·채점·첨부파일이 삭제됩니다. 삭제하시겠습니까?"><button class="btn btn-sm btn-outline-danger">삭제</button></form></td></tr></tbody></table></div></div>
<div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0">CSV로 수강생 일괄 등록</h2></div><div class="card-body"><p class="small text-muted">성적표 CSV를 그대로 사용하거나 UTF-8 CSV에 <code>학번</code> 열을 넣어 업로드하세요. 등록된 학생 계정만 처리되며 이미 등록된 학생은 건너뜁니다. 한 번에 최대 1,000명, 5MB까지 가능합니다.</p><form method="post" enctype="multipart/form-data" th:action="@{/instructor/courses/{id}/enrollments/import(id=${course.id})}"><div class="form-row align-items-end"><div class="col-md-8 form-group mb-md-0"><label for="rosterCsv">수강생 CSV</label><input id="rosterCsv" class="form-control-file" type="file" name="file" accept=".csv,text/csv" required></div><div class="col-md-4"><button class="btn btn-outline-primary">학번 기준 수강 등록</button></div></div></form></div></div>
<div class="card shadow"><div class="card-header"><h2 class="h6 m-0">수강생 목록 <span class="badge badge-primary" th:text="${#lists.size(students)}"></span></h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>학번</th><th>이름</th><th>이메일</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(students)}"><td colspan="3" class="empty">등록한 학생이 없습니다.</td></tr><tr th:each="e : ${students}"><td th:text="${e.student.studentNumber}"></td><td th:text="${e.student.name}"></td><td th:text="${e.student.email}"></td></tr></tbody></table></div></div>
</section></html>
