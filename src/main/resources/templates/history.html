<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('제출 이력', ~{::section})}"><section>
<a th:href="${me.role.name() == 'INSTRUCTOR' ? '/instructor/assignments/' + submission.assignment.id : '/student/assignments/' + submission.assignment.id}">← 과제로 돌아가기</a><h1 class="h3 mt-3">제출 이력</h1><p class="page-intro" th:text="${submission.assignment.title} + ' · ' + ${submission.student.name}"></p>
<p class="small text-muted">두 버전을 선택하면 파일명·제출 시각·점수·개발 기록을 나란히 비교합니다. 파일 내용은 각 버전을 내려받아 확인하세요.</p>
<div class="row mb-3"><div class="col-md-6"><label for="compare-left">비교할 버전 A</label><select id="compare-left" class="form-control" data-compare-target="compare-left-output"><option value="current-version">현재 버전</option><option th:each="r : ${revisions}" th:value="'version-' + ${r.id}" th:text="'이전 버전 ' + ${r.revisionNumber}"></option></select></div><div class="col-md-6"><label for="compare-right">비교할 버전 B</label><select id="compare-right" class="form-control" data-compare-target="compare-right-output"><option value="current-version">현재 버전</option><option th:each="r, i : ${revisions}" th:value="'version-' + ${r.id}" th:selected="${i.first}" th:text="'이전 버전 ' + ${r.revisionNumber}"></option></select></div></div>
<div class="row mb-4"><div class="col-md-6"><div id="compare-left-output" class="card card-body shadow mb-3"></div></div><div class="col-md-6"><div id="compare-right-output" class="card card-body shadow mb-3"></div></div></div>
<div class="card shadow mb-3"><div class="card-body" id="current-version"><h2 class="h5">현재 버전</h2><a th:href="@{/files/submissions/{id}(id=${submission.id})}" th:text="${submission.fileName}"></a><p class="small mt-2" th:text="'제출: ' + ${#temporals.format(submission.submittedAt,'yyyy-MM-dd HH:mm:ss')}"></p><p th:text="${submission.score == null ? '채점 대기' : submission.score + ' / ' + submission.assignment.maxScore + '점'}"></p><p class="description" th:text="${submission.feedback}"></p><div th:replace="~{fragments :: development(${submission.development})}"></div></div></div>
<div class="card shadow mb-3" th:each="r : ${revisions}"><div class="card-body" th:id="'version-' + ${r.id}"><h2 class="h5" th:text="'이전 버전 ' + ${r.revisionNumber}"></h2><a th:href="@{/files/revisions/{id}(id=${r.id})}" th:text="${r.fileName}"></a><p class="small mt-2" th:text="'제출: ' + ${#temporals.format(r.submittedAt,'yyyy-MM-dd HH:mm:ss')}"></p><p th:text="${r.score == null ? '당시 미채점' : r.score + ' / ' + r.maxScore + '점'}"></p><p class="description" th:text="${r.rubricSummary}"></p><p class="description" th:text="${r.feedback}"></p><div th:replace="~{fragments :: development(${r.development})}"></div></div></div>
<h2 class="h5 mt-4">잠금 해제 기록</h2><div class="card shadow"><div class="card-body"><p class="text-muted" th:if="${#lists.isEmpty(unlocks)}">해제 기록이 없습니다.</p><div class="border-bottom py-2" th:each="audit : ${unlocks}"><strong th:text="${audit.instructor.name}"></strong><span class="small ml-2" th:text="${#temporals.format(audit.unlockedAt,'yyyy-MM-dd HH:mm')}"></span><p class="description mb-0" th:text="${audit.reason}"></p></div></div></div>
</section></html>
