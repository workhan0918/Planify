<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 회원가입 · Planify</title><link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet"><link th:href="@{/css/planify.css}" rel="stylesheet"></head>
<body class="auth-page"><main class="card auth-card shadow-lg"><div class="auth-brand">Planify.</div><h1 class="h4 my-4">학생 회원가입</h1><form th:action="@{/signup}" th:object="${form}" method="post">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div></div>
<div class="form-group"><label for="studentNumber">학번</label><input class="form-control" th:field="*{studentNumber}" maxlength="30" pattern="[A-Za-z0-9-]{1,30}" required></div><div class="form-group"><label for="name">이름</label><input class="form-control" th:field="*{name}" maxlength="80" required></div><div class="form-group"><label for="email">이메일</label><input class="form-control" th:field="*{email}" type="email" maxlength="150" autocomplete="username" required></div><div class="form-group"><label for="password">비밀번호 (8~60자)</label><input class="form-control" id="password" name="password" type="password" minlength="8" maxlength="60" autocomplete="new-password" required></div><button class="btn btn-primary btn-block">가입하기</button></form><a class="mt-3 text-center" th:href="@{/login}">로그인으로 돌아가기</a></main></body></html>
