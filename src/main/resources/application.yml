spring:
  application:
    name: Planify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planify}
    username: ${DB_USERNAME:planify}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    time-zone: Asia/Seoul
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
planify:
  upload-dir: ${UPLOAD_DIR:./uploads}
  instructor:
    email: ${INSTRUCTOR_EMAIL:instructor@planify.local}
    password: ${INSTRUCTOR_PASSWORD}
    name: ${INSTRUCTOR_NAME:담당 강사}
